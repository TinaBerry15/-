<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garment Viz</title>
<link rel="stylesheet" href="/css/style.css">
<script type="importmap">
{
  "imports": {
    "three": "/vendor/three/three.module.js",
    "three/addons/": "/vendor/three/addons/"
  }
}
</script>
</head>
<body>

<div id="stage"></div>

<aside id="panel">
  <header>
    <h1>Garment Viz</h1>
    <p class="sub">頭の中の服を、すぐ形にする</p>
  </header>

  <section class="group ask">
    <h3>言葉で指示する</h3>
    <textarea id="prompt" rows="3"
      placeholder="例: もっとだらっとして。袖は手を隠すくらい余らせて、裾は膝下まで。色はくすんだ青"></textarea>
    <button id="ask" class="primary">この言葉で作る <kbd>⌘↵</kbd></button>
    <p id="status"></p>
  </section>

  <section class="group">
    <h3>下書き</h3>
    <div id="presets" class="chips"></div>
  </section>

  <div id="controls"></div>

  <section class="group">
    <h3>色</h3>
    <input id="color" type="color" value="#c8c3bb">
  </section>

  <section class="group">
    <h3>お気に入り</h3>
    <div id="favorites" class="chips"></div>
    <button id="save">この形を保存</button>
  </section>

  <section class="group actions">
    <h3>書き出し・表示</h3>
    <div class="btn-row">
      <button id="png">画像 (PNG)</button>
      <button id="glb">3D (GLB)</button>
    </div>
    <div class="btn-row">
      <button id="spin">回す</button>
      <button id="reset">初期化</button>
    </div>
  </section>
</aside>

<script type="module" src="/js/app.mjs"></script>
</body>
</html>
